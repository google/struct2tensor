name: Build

on:
  push:
    branches: [ master, 'r*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, 'r*' ]

permissions:
  contents: read

env:
  USE_BAZEL_VERSION: 7.7.0

jobs:
  build:
    name: Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up conda environment
      uses: conda-incubator/setup-miniconda@505e6394dae86d6a5c7fbb6e3fb8938e3e863830 # v3.1.1
      with:
        auto-activate-base: false
        activate-environment: s2t-env
        environment-file: environment.yml
        python-version: ${{ matrix.python-version }}
        use-mamba: true

    - name: Install Bazel
      shell: bash -l {0}
      run: |
        # Install Bazelisk (manages Bazel versions)
        mkdir -p "$HOME/.local/bin"
        ARCH=$(uname -m)
        if [ "$ARCH" == "x86_64" ]; then
          ARCH="amd64"
        fi
        if [ "$RUNNER_OS" == "Linux" ]; then
          curl -Lo "$HOME/.local/bin/bazel" "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-${ARCH}"
        elif [ "$RUNNER_OS" == "macOS" ]; then
          curl -Lo "$HOME/.local/bin/bazel" "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-darwin-${ARCH}"
        fi
        chmod +x "$HOME/.local/bin/bazel"
        if [ -n "$CONDA_PREFIX" ]; then
          cp "$HOME/.local/bin/bazel" "$CONDA_PREFIX/bin/bazel"
        fi
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "USE_BAZEL_VERSION=7.7.0" >> $GITHUB_ENV
        bazel --version

    - name: Configure Bazel
      shell: bash -l {0}
      run: |
        ./configure.sh
        bazel --version

    - name: Patch Apple CC toolchain (macOS only)
      if: runner.os == 'macOS'
      shell: bash -l {0}
      run: bazel build //:patch_local_config_apple_cc

    - name: Build struct2tensor
      shell: bash -l {0}
      run: bazel build //struct2tensor:path --verbose_failures

    - name: Build all targets
      if: runner.os == 'Linux'
      shell: bash -l {0}
      run: bazel build //...

    - name: Build Release Wheel
      shell: bash -l {0}
      run: bazel run //:build_pip_package

    - name: Repair Linux Wheel with Auditwheel
      if: runner.os == 'Linux'
      shell: bash -l {0}
      run: |
        python -m pip install auditwheel
        auditwheel repair --exclude 'libtensorflow_framework.so.*' dist/*.whl -w repaired_wheels/
        rm -f dist/*.whl
        mv repaired_wheels/*.whl dist/

    - name: Upload Wheel Artifact
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/*.whl

  docker-serving-build:
    name: Build Docker Serving Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Pre-pull Ubuntu base image from GCR mirror to prevent Docker Hub timeouts
      run: |
        docker pull mirror.gcr.io/library/ubuntu:22.04
        docker tag mirror.gcr.io/library/ubuntu:22.04 ubuntu:22.04
    - name: Build TF-Serving Docker Image
      run: |
        cd struct2tensor/tools/tf_serving_docker
        docker build -t struct2tensor-serving:latest .

  pypi-publish:
    name: Publish Wheels to PyPI
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/r'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Download all wheels
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        pattern: wheels-*
        path: dist/
        merge-multiple: true

    - name: Publish Package to PyPI
      # zizmor: ignore[use-trusted-publishing]
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dist/
        skip-existing: true
